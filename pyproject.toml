[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-pi-router"
version = "0.1.0"
description = "PI 多厂商模型路由：角色分档派发 + Jev 决策 + 跨厂商 review + 双轨兜底"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["jev_pi_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
